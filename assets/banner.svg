<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Accent Gradient 1 -->
    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Accent Gradient 2 -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Glowing Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="badgeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .pulsing-orb-1 {
        animation: pulse1 7s ease-in-out infinite alternate;
      }
      .pulsing-orb-2 {
        animation: pulse2 9s ease-in-out infinite alternate;
      }
      .grid-lines {
        opacity: 0.12;
      }
      .animated-tag {
        animation: floatTag 4s ease-in-out infinite alternate;
      }
      .shimmer-bar {
        animation: shimmer 3.5s linear infinite;
      }
      @keyframes pulse1 {
        0% { transform: scale(1) translate(0, 0); opacity: 0.35; }
        100% { transform: scale(1.25) translate(40px, 30px); opacity: 0.65; }
      }
      @keyframes pulse2 {
        0% { transform: scale(1.1) translate(0, 0); opacity: 0.3; }
        100% { transform: scale(0.85) translate(-50px, -20px); opacity: 0.6; }
      }
      @keyframes floatTag {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-6px); }
      }
      @keyframes shimmer {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: -600; }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/>

  <!-- Decorative Animated Orbs -->
  <circle cx="150" cy="80" r="160" fill="#38bdf8" filter="url(#glow)" class="pulsing-orb-1" opacity="0.3"/>
  <circle cx="1050" cy="280" r="190" fill="#c084fc" filter="url(#glow)" class="pulsing-orb-2" opacity="0.35"/>
  <circle cx="600" cy="180" r="120" fill="#6366f1" filter="url(#glow)" class="pulsing-orb-1" opacity="0.2"/>

  <!-- Tech Grid Background -->
  <g class="grid-lines" stroke="#94a3b8" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="360"/>
    <line x1="250" y1="0" x2="250" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="550" y1="0" x2="550" y2="360"/>
    <line x1="700" y1="0" x2="700" y2="360"/>
    <line x1="850" y1="0" x2="850" y2="360"/>
    <line x1="1000" y1="0" x2="1000" y2="360"/>
    <line x1="1150" y1="0" x2="1150" y2="360"/>

    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
  </g>

  <!-- Banner Border -->
  <rect x="2" y="2" width="1196" height="356" rx="14" fill="none" stroke="url(#glowGrad1)" stroke-width="2" opacity="0.6"/>

  <!-- Glowing Accent Header Bar -->
  <line x1="200" y1="20" x2="1000" y2="20" stroke="url(#glowGrad1)" stroke-width="3" stroke-linecap="round" stroke-dasharray="120 480" class="shimmer-bar"/>

  <!-- Central Content -->
  <g text-anchor="middle">
    <!-- Category Pill Badge -->
    <g class="animated-tag" transform="translate(0, 0)">
      <rect x="475" y="45" width="250" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9"/>
      <text x="600" y="66" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="2">🚀 AWESOME ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="145" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">
      Awesome Publishing CMS
    </text>

    <!-- Gradient Highlight Underline -->
    <rect x="420" y="165" width="360" height="4" rx="2" fill="url(#glowGrad1)" filter="url(#badgeGlow)"/>

    <!-- Subtitle -->
    <text x="600" y="210" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="500">
      Curated Landscape of SaaS &amp; Open-Source Content Management Platforms
    </text>

    <!-- Feature Feature Badges Row -->
    <g transform="translate(0, 255)">
      <!-- Badge 1: Headless & API-First -->
      <rect x="180" y="0" width="180" height="38" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="1.2" opacity="0.95"/>
      <text x="270" y="24" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">⚡ Headless &amp; API-First</text>

      <!-- Badge 2: Open-Source Core -->
      <rect x="380" y="0" width="190" height="38" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.95"/>
      <text x="475" y="24" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">🔓 Open-Source Power</text>

      <!-- Badge 3: Enterprise & SaaS -->
      <rect x="590" y="0" width="180" height="38" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" opacity="0.95"/>
      <text x="680" y="24" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">🏢 Enterprise SaaS</text>

      <!-- Badge 4: Git-Based Workflows -->
      <rect x="790" y="0" width="190" height="38" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.2" opacity="0.95"/>
      <text x="885" y="24" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">🌿 Git-Based Workflows</text>
    </g>
  </g>
</svg>
